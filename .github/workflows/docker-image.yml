name: CI + Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    # Sin --legacy-peer-deps: las versiones de Angular están alineadas y el lockfile incluye los peers.
    - name: Install
      run: npm ci

    - name: Icon subset is up to date
      run: npm run icons:check

    # El número de "any" solo puede bajar (ver scripts/check-any.js).
    - name: No new any
      run: npm run any:check

    - name: Unit tests
      run: npm run test:ci

    # Falla si una dependencia de producción tiene una vulnerabilidad alta o crítica. --omit=peer/optional: npm
    # cuenta como "de producción" peers opcionales que solo usa el tooling (p. ej. braces vía karma/dev-server).
    - name: Audit production dependencies
      run: npm audit --omit=dev --omit=peer --omit=optional --audit-level=high

    - name: Build
      run: npx ng build

    # Pruebas en navegador sobre el build anterior, con el API simulado (ver e2e/api-simulada.ts).
    - name: E2E tests
      run: |
        npx playwright install --with-deps chromium
        npm run e2e

  docker:

    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag pixicity

    # Imagen del render en el servidor para bots (servicio "ssr" del compose): se construye para detectar a tiempo
    # cualquier código que rompa el SSR (p. ej. uso de window/localStorage al arrancar).
    - name: Build the SSR image
      run: docker build . --file Dockerfile --target ssr --tag pixicity-ssr

    # Solo se publica al hacer push a main; las pull requests construyen la imagen pero no la suben.
    - name: login-registry
      if: github.event_name == 'push'
      env:
        DOCKER_USER: ${{secrets.DOCKER_USER}}
        DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
      run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

    - name: push-image
      if: github.event_name == 'push'
      run: |
        docker tag pixicity nesticle8bit/pixicity:latest
        docker push nesticle8bit/pixicity:latest
