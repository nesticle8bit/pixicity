@if (shoutsList.length > 0) {
  <div class="sh-wall">
    @for (shout of shoutsList; track shout.id) {
      <app-shout-card [shout]="shout" [enPerfil]="true" (fijadoCambio)="getShouts()" />
    }
  </div>
} @else {
  <div class="sh-empty">
    <i class="ti ti-message-2-off" aria-hidden="true"></i>
    <p>Todavía no hay shouts por aquí.</p>
  </div>
}
