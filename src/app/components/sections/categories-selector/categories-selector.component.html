<section style="margin-top: -8px" class="float-end">
  <div class="catbox">
    <div class="simcat" (mouseenter)="display = true" (mouseleave)="display = false">
      {{etiqueta}}<span></span>
    </div>

    <div class="liscat" [style.display]="display ? 'block' : 'none'" (mouseenter)="display = true"
      (mouseleave)="display = false">
      @if (tipo === 'comunidades') {
        <a [routerLink]="['/comunidades']" [queryParams]="{ categoria: null, page: null }" queryParamsHandling="merge"
          [class.listo]="!seleccionada" (click)="display = false">Todas las categorías</a>

        @for (categoria of categorias; track categoria.seo) {
          <a [routerLink]="['/comunidades']" [queryParams]="{ categoria: categoria.seo, page: null }"
            queryParamsHandling="merge" [class.listo]="categoria.seo === seleccionada" (click)="display = false">
            {{categoria.nombre}}
          </a>
        }
      } @else {
        <a [routerLink]="['']" class="listo">Todas las categorías</a>

        @for (categoria of categorias; track categoria) {
          <a [routerLink]="['/posts/' + categoria.seo]">
            <img src="/assets/images/categorias/{{categoria.icono}}" class="image-middle me-1" alt="" aria-hidden="true" loading="lazy"/>
            {{categoria.nombre}}
          </a>
        }
      }
    </div>
  </div>
</section>
