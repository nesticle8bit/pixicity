@if (anuncio(); as anuncio) {
  @if (!hideTitle()) {
  <h2 class="main-title mt-2 mb-3">
    <span>Publicidad</span>
    <strong class="float-end" style="background: #fff; margin-top: -2px; color: #8B8B8B; padding-left: 7px;">
      <i class="ti ti-pig-money cursor--help"
        matTooltip="Con esta publicidad nos apoyas a mantener viva esta comunidad, de antemano muchas gracias ❤️ Att: Gorgoroth"></i>
    </strong>
  </h2>
  }

  @if (anuncio.tipo === 'componente') {
  <section class="{{class ? class : 'mb-4'}}">
    @switch (anuncio.componente) {
      @case ('discord') {
        <app-home-discord [variante]="anuncio.variante ?? 'cuadrado'" [mostrarTitulo]="false" />
      }
    }
  </section>
  } @else {
  <section class="{{class ? class : 'mb-4'}}" [innerHTML]="anuncio.html | contenidoSeo: 'Publicidad'"></section>
  }
}
