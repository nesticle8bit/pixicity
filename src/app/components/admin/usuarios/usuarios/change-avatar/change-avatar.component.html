@if (currentUser.usuario && currentUser.usuario.rango === 'Administrador' && data.nombre !== 'Administrador') {
  <a class="button-uppercase bnaranja follow_user_post" (click)="changeAvatar()"
     role="button" tabindex="0" (keydown.enter)="changeAvatar()" (keydown.space)="changeAvatar(); $event.preventDefault()">
    <i class="ti ti-photo"></i> Cambiar avatar
  </a>
}
