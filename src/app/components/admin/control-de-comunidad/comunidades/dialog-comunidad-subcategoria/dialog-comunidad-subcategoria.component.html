<h2 mat-dialog-title>{{data?.sub ? 'Actualizar' : 'Agregar'}} sub-categoría</h2>

<form [formGroup]="formGroup" (ngSubmit)="guardar()">
  <mat-dialog-content>
    <p class="text-muted" style="font-size:13px;">Categoría: <strong>{{categoria?.nombre}}</strong></p>

    <div class="mb-3">
      <label class="form-label" for="dialog-comunidad-subcategoria-nombre">Nombre</label>
      <input id="dialog-comunidad-subcategoria-nombre" type="text" class="form-control" formControlName="nombre" cdkFocusInitial />
    </div>

    <div class="mb-3">
      <label class="form-label" for="dialog-comunidad-subcategoria-orden">Orden</label>
      <input id="dialog-comunidad-subcategoria-orden" type="number" class="form-control" formControlName="orden" />
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button mat-dialog-close>Cancelar</button>
    <button type="submit" mat-button [disabled]="formGroup.invalid">Guardar</button>
  </mat-dialog-actions>
</form>
