@if (!cargado) {
  <!-- Mismo alto que la barra mientras llegan las noticias: si no, al aparecer empuja la página (CLS). -->
  <section class="last_news last_news--cargando container" aria-hidden="true"></section>
} @else if (noticias.length > 0) {
  <section class="last_news container">
    <div class="row">
      @for (noticia of noticias; track noticia; let i = $index) {
        <div class="col-12">
          <strong class="hide" [class.fade-in]="i === currentIndex" [innerHTML]="noticia.contenido"></strong>
        </div>
      }
    </div>
  </section>
}
