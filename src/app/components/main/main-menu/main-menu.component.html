<section class="main-menu">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <ul class="list-unstyled list-inline mb-0 pt-2" role="list">
          @for (link of tabs; track link.route) {
            <li class="list-inline-item main-menu--item" [ngClass]="{'main-menu--item--active': isActive(link)}">
              <a [routerLink]="link.route" [title]="link.label" [attr.aria-label]="link.label"
                [attr.aria-current]="isActive(link) ? 'page' : null">
                <i class="ti {{link.icon}} d-sm-none" aria-hidden="true"></i>
                <span class="d-none d-sm-inline">{{link.label}}</span>
              </a>
            </li>
          }

          <!-- Login y registro: en móvil viven en el botón "Entrar" del header y en el menú hamburguesa. -->
          @if (!currentUser.usuario) {
            <li class="list-inline-item main-menu--item d-none d-md-block"
              [ngClass]="{'main-menu--item--active': isRouteActive('/login')}">
              <a routerLink="/login" title="Iniciar sesión">
                <span>Iniciar sesión</span>
              </a>
            </li>

            <li class="list-inline-item main-menu--item main-menu--item--register d-none d-md-block"
              [ngClass]="{'main-menu--item--active': isRouteActive('/registro')}">
              <a routerLink="/registro" title="Registrate Ya!">
                <span>Registrate Ya!</span>
              </a>
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</section>
