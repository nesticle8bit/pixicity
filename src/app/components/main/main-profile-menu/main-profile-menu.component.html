<section class="sub-menu container">
    <div class="row">
        <div class="col-12">
            <ul class="list-unstyled list-inline mb-0 py-2">
                <li class="list-inline-item sub-menu--item">
                    <a [ngClass]="{'selected': selected === 'activity'}" role="button" tabindex="0" [attr.aria-pressed]="selected === 'activity'" (click)="select('activity')" (keydown.enter)="select('activity')" (keydown.space)="select('activity'); $event.preventDefault()">
                        <i class="ti ti-antenna"></i>
                        <span style="margin-left: 2px;">Actividad</span>
                    </a>
                </li>

                <li class="list-inline-item sub-menu--item">
                    <a [ngClass]="{'selected': selected === 'information'}" role="button" tabindex="0" [attr.aria-pressed]="selected === 'information'" (click)="select('information')" (keydown.enter)="select('information')" (keydown.space)="select('information'); $event.preventDefault()">
                        <i class="ti ti-info-circle"></i>
                        <span style="margin-left: 2px;">Información</span>
                    </a>
                </li>

                <li class="list-inline-item sub-menu--item">
                    <a [ngClass]="{'selected': selected === 'shouts'}" role="button" tabindex="0" [attr.aria-pressed]="selected === 'shouts'" (click)="select('shouts')" (keydown.enter)="select('shouts')" (keydown.space)="select('shouts'); $event.preventDefault()">
                        <i class="ti ti-id-badge"></i>
                        <span style="margin-left: 2px;">Mi</span>
                    </a>
                </li>

                <li class="list-inline-item sub-menu--item">
                    <a [ngClass]="{'selected': selected === 'posts'}" role="button" tabindex="0" [attr.aria-pressed]="selected === 'posts'" (click)="select('posts')" (keydown.enter)="select('posts')" (keydown.space)="select('posts'); $event.preventDefault()">
                        <i class="ti ti-file-text"></i>
                        <span style="margin-left: 2px;">Posts</span>
                    </a>
                </li>

                <li class="list-inline-item sub-menu--item">
                    <a [ngClass]="{'selected': selected === 'followers'}" role="button" tabindex="0" [attr.aria-pressed]="selected === 'followers'" (click)="select('followers')" (keydown.enter)="select('followers')" (keydown.space)="select('followers'); $event.preventDefault()">
                        <i class="ti ti-users"></i>
                        <span style="margin-left: 2px;">Seguidores</span>
                    </a>
                </li>

                <li class="list-inline-item sub-menu--item">
                    <a [ngClass]="{'selected': selected === 'medals'}" role="button" tabindex="0" [attr.aria-pressed]="selected === 'medals'" (click)="select('medals')" (keydown.enter)="select('medals')" (keydown.space)="select('medals'); $event.preventDefault()">
                        <i class="ti ti-medal"></i>
                        <span style="margin-left: 2px;">Medallas</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</section>
