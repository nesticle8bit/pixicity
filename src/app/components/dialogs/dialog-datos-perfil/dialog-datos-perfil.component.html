<h2 mat-dialog-title>Editar datos de {{ data.userName }}</h2>

<form [formGroup]="formGroup" (ngSubmit)="guardar()">
  <mat-dialog-content>
    @if (cargando) {
      <div class="adm-cargando" role="progressbar" aria-label="Cargando"></div>
    }

    <div class="mb-3">
      <label class="form-label" for="datos-perfil-genero">Género</label>
      <select id="datos-perfil-genero" class="form-select" formControlName="genero">
        @for (genero of generos; track genero.value) {
          <option [ngValue]="genero.value">{{ genero.label }}</option>
        }
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="datos-perfil-pais">País</label>
      <select id="datos-perfil-pais" class="form-select" formControlName="paisId" (change)="cambiarPais()">
        @for (pais of paises; track pais.id) {
          <option [ngValue]="pais.id">{{ pais.nombre }}</option>
        }
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="datos-perfil-estado">Región</label>
      <select id="datos-perfil-estado" class="form-select" formControlName="estadoId">
        @for (estado of estados; track estado.id) {
          <option [ngValue]="estado.id">{{ estado.nombre }}</option>
        }
      </select>
    </div>
    <div>
      <label class="form-label" for="datos-perfil-razon">Motivo del cambio <span class="text-muted">(opcional)</span></label>
      <input id="datos-perfil-razon" class="form-control" formControlName="razon" maxlength="1000">
      <small class="text-muted">Queda en el historial de moderación junto con los cambios.</small>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button mat-dialog-close>Cancelar</button>
    <button type="submit" mat-button color="primary" [disabled]="cargando || guardando || formGroup.invalid">Guardar</button>
  </mat-dialog-actions>
</form>
