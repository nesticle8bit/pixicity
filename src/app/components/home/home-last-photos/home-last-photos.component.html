<h2 class="main-title mb-2">
  <span>Top Fotos</span>

  <div class="float-end">
    <img loading="lazy" decoding="async" class="cursor--pointer"
      [src]="paused ? '/assets/images/icons/icon_play.png' : '/assets/images/icons/icon_pause.png'"
      [matTooltip]="paused ? 'Reanudar' : 'Pausar'" style="background: #fff; padding-left: 5px"
      (click)="togglePause()" alt="" role="button" tabindex="0" [attr.aria-label]="paused ? 'Reanudar' : 'Pausar'" (keydown.enter)="togglePause()" (keydown.space)="togglePause(); $event.preventDefault()">
  </div>
</h2>

@if (loading) {
<div class="carousel-skeleton"></div>
}

@if (!loading && fotos.length > 0) {
<div class="carousel" (mouseenter)="stopTimer()" (mouseleave)="startTimer()">
  @for (foto of fotos; track foto.id; let i = $index) {
  <a [routerLink]="['/fotos', foto.usuario, foto.id, foto.url]" class="carousel-slide"
    [class.active]="i === currentIndex">
    <!-- La primera es el LCP de la portada: sin lazy y con prioridad alta. -->
    <img [attr.src]="debeCargar(i) ? (foto | thumbFoto: 280) : null" [alt]="foto.titulo" decoding="async"
      [attr.loading]="i === 0 ? 'eager' : 'lazy'" [attr.fetchpriority]="i === 0 ? 'high' : null">

    <div class="carousel-progress" [class.running]="i === currentIndex && !paused" [class.paused]="paused"></div>

    <div class="carousel-overlay">
      <div class="overlay-rank">#{{i + 1}}</div>
      <div class="overlay-body">
        <span class="overlay-title">{{foto.titulo}}</span>
        <span class="overlay-author">{{foto.usuario}}</span>
        <div class="overlay-stats">
          <span class="stat-pos">
            <i class="ti ti-thumb-up"></i> {{foto.votosPositivos}}
          </span>
          <span class="stat-views">
            <i class="ti ti-eye"></i> {{foto.visitantes}}
          </span>
        </div>
      </div>
    </div>
  </a>
  }

  <button class="carousel-btn carousel-prev" (click)="prev(); startTimer()" aria-label="Foto anterior">&#8249;</button>
  <button class="carousel-btn carousel-next" (click)="next(); startTimer()" aria-label="Foto siguiente">&#8250;</button>

  <div class="carousel-dots">
    @for (foto of fotos; track foto.id; let i = $index) {
    <span class="dot" [class.active]="i === currentIndex" (click)="goTo(i)" role="button" tabindex="0"
      [attr.aria-label]="'Ver foto ' + (i + 1) + ': ' + foto.titulo" [attr.aria-current]="i === currentIndex" (keydown.enter)="goTo(i)" (keydown.space)="goTo(i); $event.preventDefault()"></span>
    }
  </div>
</div>
}
