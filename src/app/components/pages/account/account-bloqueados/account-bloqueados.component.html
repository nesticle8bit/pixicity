@if (bloqueados.length === 0) {
  <div class="bq__vacio">
    <mat-icon>sentiment_satisfied</mat-icon>
    <p>No tienes usuarios bloqueados.</p>
    <small>Cuando bloquees a alguien desde su perfil aparecerá aquí.</small>
  </div>
}

<ul class="bq">
  @for (b of bloqueados; track b.id) {
    <li class="bq__item">
      <app-user-avatar [avatar]="b.avatar" [userName]="b.userName" [height]="40" [width]="40" class="rounded-circle"></app-user-avatar>
      <a [routerLink]="['/perfil', b.userName]" class="bq__nombre">{{ b.userName }}</a>
      <button mat-stroked-button color="warn" (click)="desbloquearUsuario(b)" [attr.aria-label]="'Desbloquear a ' + b.userName">
        <mat-icon>lock_open</mat-icon> Desbloquear
      </button>
    </li>
  }
</ul>
