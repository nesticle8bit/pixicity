<form [formGroup]="formGroupCambiarContrasena" (ngSubmit)="changePassword()" class="pw">
  <div class="pw__campo">
    <label for="account-password-currentPassword">Contraseña actual</label>
    <input id="account-password-currentPassword" [type]="mostrar ? 'text' : 'password'" formControlName="currentPassword"
      class="form-control" autocomplete="current-password" />
  </div>

  <div class="pw__campo">
    <label for="account-password-newPassword">Contraseña nueva</label>
    <input id="account-password-newPassword" [type]="mostrar ? 'text' : 'password'" formControlName="newPassword"
      class="form-control" autocomplete="new-password" />
  </div>

  <div class="pw__campo">
    <label for="account-password-confirmPassword">Repetir contraseña nueva</label>
    <input id="account-password-confirmPassword" [type]="mostrar ? 'text' : 'password'" formControlName="confirmPassword"
      class="form-control" autocomplete="new-password" />
    @if (formGroupCambiarContrasena.hasError('notSame')) {
      <mat-error>La contraseña debe coincidir</mat-error>
    }
  </div>

  <label class="pw__mostrar">
    <input type="checkbox" [checked]="mostrar" (change)="mostrar = !mostrar" /> Mostrar contraseñas
  </label>

  <div class="pw__acciones">
    <button mat-flat-button color="primary" type="submit" [disabled]="formGroupCambiarContrasena.invalid">
      <mat-icon>vpn_key</mat-icon> Cambiar contraseña
    </button>
  </div>
</form>
