<div class="container container--home">
  <div class="row">
    <div class="col-12 col-sm-6 col-md-9">
      <div class="chat-header mt-2">
        <a class="back" [routerLink]="['/mensajes']"><i class="ti ti-circle-chevron-left"></i> Volver</a>

        @if (otro) {
          <app-user-avatar [avatar]="otro.avatar" [userName]="otro.userName" [height]="40"></app-user-avatar>
          <div class="chat-header__info">
            <a [routerLink]="'/perfil/' + otro.userName" [appUserPopover]="otro.userName">{{'@'}}{{otro.userName}}</a>
            <small class="text-muted d-block cursor--help" matTooltip="{{asunto}}" matTooltipPosition="above">
              {{asunto | truncate:[80]}}
            </small>
          </div>
        }
      </div>

      <div class="chat-body" #chatBody>
        @for (m of mensajes; track m.id; let i = $index) {
          @if (esNuevoDia(i)) {
            <div class="chat-day"><span>{{m.fechaRegistro | date:'fullDate'}}</span></div>
          }

          <div class="chat-row" [class.chat-row--mine]="m.esMio">
            @if (!m.esMio) {
              <app-user-avatar [avatar]="m.usuarioDe?.avatar" [userName]="m.usuarioDe?.userName" [height]="32"></app-user-avatar>
            }

            <div class="chat-bubble" [class.chat-bubble--mine]="m.esMio">
              <div class="chat-bubble__content" [innerHTML]="m.contenido"></div>
              <small class="chat-bubble__time">{{m.fechaRegistro | date:'shortTime'}}</small>
            </div>
          </div>
        } @empty {
          <p class="text-muted text-center my-4">No hay mensajes en esta conversación.</p>
        }
      </div>

      <div class="chat-reply">
        <textarea class="form-control" rows="2" title="Escribir una respuesta..." [(ngModel)]="respuesta"
          placeholder="Escribir una respuesta... (Enter para enviar, Shift+Enter nueva línea)"
          (keydown.enter)="onEnter($event)"></textarea>
        <input type="button" class="boton azul" (click)="responderMensaje()" value="Enviar"
          [disabled]="!respuesta.trim() || enviando" />
      </div>
    </div>

    <section class="col-12 col-sm-6 col-md-3 dotted-border--left">
      <app-mensajes-sidebar></app-mensajes-sidebar>
    </section>
  </div>
</div>
