@if (medallas().length) {
<section aria-labelledby="perfil-medallas-titulo">
  <!-- Igual que Seguidores: título a la izquierda sobre la línea punteada y el total a la derecha. -->
  <h2 class="main-title medallas__titulo" id="perfil-medallas-titulo">
    <span>Medallas</span>
    <span class="medallas__total">{{ medallas().length }}</span>
  </h2>

  <!-- Una por medalla; si la ganó varias veces (rankings por período) lleva el contador. -->
  <ul class="medallas">
    @for (g of grupos(); track g.m.medallaId; let i = $index) {
    @if (i < visibles) {
    <li [class]="'medalla medalla--' + g.m.nivel.toLowerCase()">
      <img [src]="src(g.m.imagen)" [alt]="g.m.titulo" width="34" height="34" loading="lazy" decoding="async"
        [matTooltip]="detalle(g.m, g.veces)" tabindex="0">
      @if (g.veces > 1) {
      <span class="medalla__veces" aria-hidden="true">{{ g.veces }}</span>
      }
    </li>
    }
    }
  </ul>

  <button type="button" class="medallas__todas" (click)="verTodas.emit()">Ver todas</button>
</section>
}
