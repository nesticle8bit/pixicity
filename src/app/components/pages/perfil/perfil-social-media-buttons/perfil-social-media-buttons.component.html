@if (redes.length > 0) {
  <section class="pf-card" aria-labelledby="perfil-redes-titulo">
    <h2 class="pf-card__titulo" id="perfil-redes-titulo">Redes sociales</h2>
    <ul class="redes">
      @for (red of redes; track red.nombre) {
        <li>
          <a class="redes__enlace" [href]="red.url" target="_blank" rel="noopener noreferrer nofollow">
            <i class="ti {{ red.icono }}" aria-hidden="true"></i>
            <span class="redes__nombre">{{ red.nombre }}</span>
            <span class="redes__usuario">{{ red.usuario }}</span>
          </a>
        </li>
      }
    </ul>
  </section>
}
