<form [formGroup]="formGroup" (ngSubmit)="publicar()" class="sh-composer">
  <div class="sh-composer__avatar">
    <app-user-avatar [avatar]="currentUser.usuario?.avatar" [userName]="currentUser.usuario?.userName" [width]="46"
      [height]="46" />
  </div>

  <div class="sh-composer__main">
    <textarea #campoShout class="sh-composer__input" rows="3" formControlName="comentario"
      aria-label="¿Qué estás pensando?" placeholder="¿Qué estás pensando?"></textarea>

    <div class="sh-composer__media">
      <i class="ti ti-link" aria-hidden="true"></i>
      <input type="url" class="sh-composer__url" formControlName="url"
        aria-label="Pega un enlace: YouTube, Spotify, imagen o web (opcional)"
        placeholder="Pega un enlace: YouTube, Spotify, imagen o web (opcional)">
    </div>

    @if (formGroup.value.url) {
    <div class="sh-composer__preview">
      <app-shout-media [url]="formGroup.value.url" [tipo]="detectarTipo(formGroup.value.url)" />
    </div>
    }

    <div class="sh-composer__actions">
      <span class="sh-composer__hint">Comparte algo con la comunidad</span>
      <button #botonEmojis type="button" class="sh-composer__emoji" (click)="abrirEmojis(botonEmojis)"
        aria-label="Agregar emoji" aria-haspopup="dialog" [attr.aria-expanded]="emojisAbierto">
        <i class="ti ti-mood-smile" aria-hidden="true"></i>
      </button>
      <button type="submit" class="sh-btn" [disabled]="!formGroup.value.comentario?.trim() || enviando()">
        <i class="ti ti-send" aria-hidden="true"></i> Compartir
      </button>
    </div>
  </div>
</form>
