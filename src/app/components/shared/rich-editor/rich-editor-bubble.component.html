<div #bubbleEl class="rich-editor__bubble" [class.is-visible]="!!modo()" [class.is-below]="debajo()"
  [style.top.px]="top()" [style.left.px]="left()" [style.--arrow-x]="flechaX() + 'px'"
  (mousedown)="mantenerSeleccion.emit($event)">

  @switch (modo()) {
  @case ('format') {
  <div class="rich-editor__bubble-row">
    @for (btn of marcas(); track btn.icon) {
    <button type="button" [title]="btn.title" [attr.aria-label]="btn.title"
      [class.active]="activas().has(btn.mark!)" [attr.aria-pressed]="activas().has(btn.mark!)"
      (click)="btn.run()">
      <mat-icon>{{ btn.icon }}</mat-icon>
    </button>
    }

    <span class="rich-editor__bubble-sep"></span>

    <button type="button" title="Enlace (Ctrl+K)" aria-label="Enlace" (click)="editarEnlace.emit()">
      <mat-icon>link</mat-icon>
    </button>
    <button type="button" class="btn-color" title="Color y resaltado" aria-label="Color y resaltado"
      [class.active]="mostrarColores()" (click)="alternarColores.emit()">
      <mat-icon>format_color_text</mat-icon>
      <mat-icon class="arrow">arrow_drop_down</mat-icon>
    </button>

    <span class="rich-editor__bubble-sep"></span>

    <button type="button" title="Quitar formato" aria-label="Quitar formato" (click)="quitarFormato.emit()">
      <mat-icon>format_clear</mat-icon>
    </button>
  </div>

  @if (mostrarColores()) {
  <div class="rich-editor__bubble-palette">
    <ng-container [ngTemplateOutlet]="paleta()" [ngTemplateOutletContext]="{ $implicit: true }"></ng-container>
  </div>
  }
  }

  @case ('link') {
  <div class="rich-editor__bubble-row rich-editor__link-preview">
    <a class="rich-editor__link-url" [href]="href()" target="_blank" rel="noopener noreferrer" [title]="href()">
      <mat-icon>open_in_new</mat-icon>
      <span>{{ href() }}</span>
    </a>
    <span class="rich-editor__bubble-sep"></span>
    <button type="button" title="Editar enlace" aria-label="Editar enlace" (click)="editarEnlace.emit()">
      <mat-icon>edit</mat-icon>
    </button>
    <button type="button" title="Quitar enlace" aria-label="Quitar enlace" (click)="quitarEnlace.emit()">
      <mat-icon>link_off</mat-icon>
    </button>
  </div>
  }

  @case ('edit-link') {
  <div class="rich-editor__bubble-link">
    <mat-icon>link</mat-icon>
    <input #linkInputEl type="text" placeholder="Pega o escribe un enlace…" aria-label="URL del enlace"
      [value]="href()" (keydown.enter)="aplicarEnlace.emit(); $event.preventDefault()"
      (keydown.escape)="cancelarEnlace.emit(); $event.stopPropagation()" />
    <button type="button" class="apply" title="Aplicar" aria-label="Aplicar" (click)="aplicarEnlace.emit()">
      <mat-icon>check</mat-icon>
    </button>
    <button type="button" class="remove" title="Quitar enlace" aria-label="Quitar enlace" (click)="quitarEnlace.emit()">
      <mat-icon>link_off</mat-icon>
    </button>
  </div>
  }
  }
</div>
