<span class="monac_icons" [ngClass]="{
        'ma_comment_post': tipo() === 'Comentario', 
        'ma_voto_positivo': tipo() === 'Like' || tipo() === 'ComunidadVoto', 
        'ma_voto_negativo': tipo() === 'Dislike', 
        'ma_star': tipo() === 'Favoritos', 
        'ma_points': tipo() === 'Puntos', 
        'ma_follow': tipo() === 'Seguir' || tipo() === 'ComunidadMiembro',
        'ma_blue_ball': tipo() === 'ComentarioSiguePost',
        'ma_share': tipo() === 'Recomendacion' || tipo() === 'Reshout',
        'ma_wall_post': tipo() === 'Shout',
        'ma_monitor_rango': tipo() === 'Rango' || tipo() === 'ComunidadRango',
        'ma_post': tipo() === 'PostNuevoUsuarioQueSigues' || tipo() === 'ComunidadTema',
        'ma_comment_resp': tipo() === 'Respuestas' || tipo() === 'ComunidadRespuesta'
        }">
  @if (tipo() === 'Moderacion') {
  <i class="ti ti-shield-exclamation tipo-moderacion" aria-hidden="true"></i>
  }
</span>
