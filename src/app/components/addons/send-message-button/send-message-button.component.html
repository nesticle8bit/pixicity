@if (currentUser?.usuario && currentUser?.usuario?.userName !== userName()) {

    <a class="button-uppercase bazul" (click)="enviarMP()" role="button" tabindex="0" (keydown.enter)="enviarMP()" (keydown.space)="enviarMP(); $event.preventDefault()">

        <i class="ti ti-mail"></i>
        } Enviar MP
      </a>
    </div>
  }
