<section class="mod-panel">
  <header class="mod-panel__head">
    <h1 class="mod-panel__title"><i class="ti ti-tool" aria-hidden="true"></i> Moderación</h1>
    <p class="mod-panel__desc">
      Todo lo que hagas aquí queda registrado en el
      <a routerLink="/mod-history">historial de moderación</a>, con lo que cambiaste y la causa.
    </p>
  </header>

  <nav class="mod-panel__tabs" aria-label="Secciones de moderación">
    @for (p of pestanas; track p.route) {
    <a [routerLink]="p.route" routerLinkActive="active" [attr.aria-label]="p.label">
      <i class="ti {{p.icon}}" aria-hidden="true"></i>
      <span>{{p.label}}</span>
      @if (p.route === 'reportes' && pendientes() > 0) {
      <span class="mod-panel__badge" [attr.aria-label]="pendientes() + ' pendientes'">{{pendientes()}}</span>
      }
    </a>
    }
    <a routerLink="/mod-history" class="mod-panel__tabs-historial">
      <i class="ti ti-history" aria-hidden="true"></i>
      <span>Historial</span>
    </a>
  </nav>

  <!-- .adm-shell__content: las tablas toman el estilo de las del panel admin (_admin-tablas.scss). -->
  <div class="adm-shell__content">
    <router-outlet></router-outlet>
  </div>
</section>
