map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen       80;
    server_name  localhost;

    # Cabeceras de seguridad. Ojo: nginx no hereda add_header a un location que define los suyos
    # (cache), por eso la API y /images las repiten desde el backend.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresion: el bundle inicial ronda los 2.8MB sin comprimir y el LCP es
    # factor de ranking. gzip_static sirve los .gz precomprimidos si existen.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    location ^~ /api {
        proxy_pass http://192.168.1.3:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /images {
        proxy_pass http://192.168.1.3:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /rss {
        proxy_pass http://192.168.1.3:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/sitemap(-[a-z]+-[0-9]+)?\.xml$ {
        proxy_pass http://192.168.1.3:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Assets con hash en el nombre: inmutables, cache larga.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|mp3)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html nunca se cachea: es quien apunta a los assets nuevos.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # /ruta/ y /ruta son URLs distintas para Google y ambas respondian 200.
    # El esquema se toma de X-Forwarded-Proto: nginx escucha en :80 detras de
    # Cloudflare y sin esto redirigia a http://, degradando la conexion.
    location ~ ^(?<sin_barra>/.+)/$ {
        return 301 $forwarded_scheme://$host$sin_barra$is_args$args;
    }

    location / {
        set $prerender 0;

        if ($http_user_agent ~* "(googlebot|bingbot|yandex|baiduspider|twitterbot|facebookexternalhit|rogerbot|linkedinbot|embedly|showyoubot|outbrain|pinterest|slackbot|vkShare|W3C_Validator|whatsapp|TelegramBot|Discordbot|LinkedInBot)") {
            set $prerender 1;
        }

        if ($uri ~* "\.(js|css|xml|less|png|jpg|jpeg|gif|pdf|txt|ico|rss|zip|mp3|ttf|woff|woff2|svg|eot)$") {
            set $prerender 0;
        }

        error_page 418 = @prerender;
        if ($prerender = 1) {
            return 418;
        }

        # La respuesta depende del User-Agent (bot -> prerender). Sin Vary,
        # una CDN como Cloudflare puede cachear el HTML prerenderizado y
        # servirselo a personas, o al reves servirle el shell vacio a Googlebot.
        add_header Vary "User-Agent";
        add_header Cache-Control "no-cache";

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Imprescindible para el respaldo de abajo: la petición ya pasó por una redirección interna (418 -> @prerender) y,
    # sin esta directiva, nginx NO permite una segunda (@prerender -> @spa_fallback), así que el bot recibía el 5xx igual.
    recursive_error_pages on;

    location @prerender {
        add_header Vary "User-Agent";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Si el SSR está caído o falla, el bot NO debe recibir el 502/503: Googlebot interpreta un 5xx como
        # "sitio no disponible", baja el rastreo y no indexa nada. En su lugar se le sirve la app normal (Googlebot
        # sabe ejecutar JavaScript), igual que a cualquier visitante.
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;

        # Angular SSR (servicio "ssr" del compose). Reemplazó a rendertron.
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_pass http://192.168.1.3:4001$request_uri;
    }

    location @spa_fallback {
        root /usr/share/nginx/html;
        add_header Vary "User-Agent";
        add_header Cache-Control "no-cache";
        try_files /index.html =503;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
